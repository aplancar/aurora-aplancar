---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Shared modules for every machine's image in this repo. Machine-specific bits
# (extra flatpaks, kargs, etc.) live in the per-machine recipe files and
# are appended after this import — see recipe-michaela.yml / recipe-melisandre.yml.
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
      - source: zshrc
        destination: /etc/skel/.zshrc   # ships a default zshrc for new users; for your own user, symlink from your dotfiles repo instead

  - type: dnf
    repos:
      keys:
        - https://repo.nordvpn.com/gpg/nordvpn_public.asc
      files:
        - nordvpn.repo
        - claude-code.repo
    install:
      packages:
        - nordvpn
        - neovim
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - kitty
        - claude-code
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: script
    scripts:
      - nordvpn-group.sh
      - set-default-shell.sh   # runs chsh or sets it via /etc/passwd during build if you want it default without manual chsh

  - type: systemd
    system:
      enabled:
        - nordvpnd.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - com.nordpass.NordPass
      - scope: user # Also add Flathub user repo, but no user packages
