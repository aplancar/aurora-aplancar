---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/aplancar/aurora-melisandre
name: aurora-melisandre
description: Aurora build for melisandre with NordVPN and flatpaks, no Steam/no ROG kargs
base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: latest

modules:
  - from-file: common-modules.yml

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.deluge_torrent.deluge

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
