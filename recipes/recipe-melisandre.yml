---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/aplancar/aurora-melisandre
name: aurora-melisandre
description: Aurora build for melisandre with NordVPN and flatpaks, no Steam/no ROG kargs
base-image: ghcr.io/ublue-os/aurora-dx  # melisandre has only an Intel iGPU
image-version: latest

modules:
  - from-file: common-modules.yml

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.deluge_torrent.deluge

  - type: systemd
    system:
      enabled:
        - sshd.service # SSH target for michaela, reached over Tailscale
        - podman-auto-update.timer # pulls new images for containers with AutoUpdate=registry (Jellyfin)
    user:
      enabled:
        - app-org.kde.krdpserver.service # KDE RDP server, starts with the Plasma session; RDP user/password set in System Settings → Remote Desktop

  - type: files
    files:
      - source: melisandre
        destination: / # melisandre-only files, e.g. the Jellyfin quadlet

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
