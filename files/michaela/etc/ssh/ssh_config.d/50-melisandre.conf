# `ssh melisandre`: over the home LAN when melisandre answers at its reserved
# address (router DHCP reservation, MAC of its BeagleMcMansion Wi-Fi profile →
# 192.168.1.140), otherwise over Tailscale (MagicDNS name; needs `tailscale up`
# on both ends — Tailscale is off at boot on both machines).
#
# HostKeyAlias keeps one known_hosts entry for both paths, and makes some other
# machine that happens to sit at 192.168.1.140 on a different network fail the
# host key check instead of being trusted.
Match host melisandre exec "timeout 1 bash -c 'echo >/dev/tcp/192.168.1.140/22' 2>/dev/null"
    HostName 192.168.1.140

Host melisandre
    HostName melisandre
    HostKeyAlias melisandre
    User aplancar
